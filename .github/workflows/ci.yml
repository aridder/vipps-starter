name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    env:
      # Dummy values — build renders all routes dynamically, no DB is hit.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      DATABASE_URL_UNPOOLED: postgresql://user:pass@localhost:5432/db
      AUTH_SECRET: ci-build-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: write # push screenshots to the ci-screenshots branch
      pull-requests: write # comment on the PR
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/app
      AUTH_SECRET: ci-e2e-secret
      ENABLE_DEV_LOGIN: "true"
      APP_NAME: App Starter
      # Enable the admin billing console so e2e captures a screenshot of it.
      FEATURE_PAYMENT_ADMIN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply migrations & seed
        run: |
          npx prisma migrate deploy
          npx prisma db seed
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            screenshots/
          if-no-files-found: ignore
      - name: Publish screenshots inline on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          ls screenshots/*.png >/dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          # Publish PNGs to an orphan 'ci-screenshots' branch. PR comments use
          # relative blob links so authenticated readers can view private repos.
          TMP="$(mktemp -d)"
          if git clone --depth 1 --branch ci-screenshots \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" "$TMP" 2>/dev/null; then
            :
          else
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" "$TMP"
            ( cd "$TMP" && git checkout --orphan ci-screenshots && git rm -rf . >/dev/null 2>&1 || true )
          fi
          rm -rf "$TMP/pr-${PR}" && mkdir -p "$TMP/pr-${PR}"
          cp screenshots/*.png "$TMP/pr-${PR}/"
          (
            cd "$TMP"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "pr-${PR}"
            git commit -m "screenshots for PR #${PR} (${SHA})" || { echo "no change"; exit 0; }
            git push origin HEAD:ci-screenshots
          )
          # Build a Markdown comment with inline images. Relative repository
          # links retain the viewer's GitHub authentication for private repos.
          BASE="../blob/ci-screenshots/pr-${PR}"
          {
            echo "### 📸 E2E screenshots"
            echo
            for f in $(ls screenshots/*.png | xargs -n1 basename | sort); do
              echo "**${f}**"
              echo
              echo "![${f}](${BASE}/${f}?raw=true&sha=${SHA})"
              echo
            done
            echo "<sub>Updated for commit ${SHA}. Generated by CI.</sub>"
          } > comment.md
          gh pr comment "${PR}" --body-file comment.md --edit-last 2>/dev/null \
            || gh pr comment "${PR}" --body-file comment.md

  deploy:
    name: Deploy to Azure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    concurrency:
      group: deploy-vipps-starter-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure target
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          actual_subscription_id="$(az account show --query id --output tsv)"
          test "${actual_subscription_id}" = "${EXPECTED_SUBSCRIPTION_ID}"

      - name: Sign in to container registry
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Set up Docker BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable runtime image
        uses: docker/build-push-action@v6
        with:
          context: ${{ vars.AZURE_BUILD_CONTEXT || '.' }}
          file: ${{ vars.AZURE_DOCKERFILE || 'Dockerfile' }}
          target: ${{ vars.AZURE_RUNTIME_TARGET || 'runner' }}
          push: true
          tags: ${{ vars.AZURE_ACR_SERVER }}/${{ vars.AZURE_APP_NAME || 'vipps-starter' }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ vars.AZURE_APP_NAME || 'vipps-starter' }}-runtime
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ vars.AZURE_APP_NAME || 'vipps-starter' }}-runtime

      - name: Build and push immutable migration image
        if: vars.AZURE_MIGRATIONS_ENABLED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ vars.AZURE_BUILD_CONTEXT || '.' }}
          file: ${{ vars.AZURE_DOCKERFILE || 'Dockerfile' }}
          target: ${{ vars.AZURE_MIGRATION_TARGET || 'migrator' }}
          push: true
          tags: ${{ vars.AZURE_ACR_SERVER }}/${{ vars.AZURE_APP_NAME || 'vipps-starter' }}-migrate:${{ github.sha }}
          cache-from: type=gha,scope=${{ vars.AZURE_APP_NAME || 'vipps-starter' }}-migrator
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ vars.AZURE_APP_NAME || 'vipps-starter' }}-migrator

      - name: Apply database migrations inside Azure
        if: vars.AZURE_MIGRATIONS_ENABLED == 'true'
        env:
          APP_RESOURCE_GROUP: ${{ vars.AZURE_APP_RESOURCE_GROUP }}
          MIGRATION_JOB_NAME: ${{ vars.AZURE_MIGRATION_JOB_NAME }}
          MIGRATION_IMAGE: ${{ vars.AZURE_ACR_SERVER }}/${{ vars.AZURE_APP_NAME || 'vipps-starter' }}-migrate:${{ github.sha }}
        run: |
          execution_name="$(az containerapp job start \
            --name "${MIGRATION_JOB_NAME}" \
            --resource-group "${APP_RESOURCE_GROUP}" \
            --image "${MIGRATION_IMAGE}" \
            --query name \
            --output tsv)"

          if [ -z "${execution_name}" ]; then
            echo "Azure did not return a migration execution name."
            exit 1
          fi

          deadline=$((SECONDS + 1800))
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            status="$(az containerapp job execution list \
              --name "${MIGRATION_JOB_NAME}" \
              --resource-group "${APP_RESOURCE_GROUP}" \
              --query "[?name=='${execution_name}'].properties.status | [0]" \
              --output tsv)"

            case "${status}" in
              Succeeded)
                echo "Migration succeeded: ${execution_name}"
                exit 0
                ;;
              Failed|Stopped|Degraded)
                echo "Migration failed with status ${status}: ${execution_name}"
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Migration timed out: ${execution_name}"
          exit 1

      - name: Deploy application image
        env:
          APP_RESOURCE_GROUP: ${{ vars.AZURE_APP_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          APP_IMAGE: ${{ vars.AZURE_ACR_SERVER }}/${{ vars.AZURE_APP_NAME || 'vipps-starter' }}:${{ github.sha }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az containerapp update \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${APP_RESOURCE_GROUP}" \
            --image "${APP_IMAGE}" \
            --revision-suffix "sha-${IMAGE_TAG:0:12}" \
            --output none

      - name: Verify deployed application
        env:
          APP_RESOURCE_GROUP: ${{ vars.AZURE_APP_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          HEALTH_URL: ${{ vars.AZURE_HEALTH_URL }}
          HEALTH_PATH: ${{ vars.AZURE_HEALTH_PATH || '/api/health' }}
        run: |
          if [ -z "${HEALTH_URL}" ]; then
            origin_host="$(az containerapp show \
              --name "${CONTAINER_APP_NAME}" \
              --resource-group "${APP_RESOURCE_GROUP}" \
              --query properties.configuration.ingress.fqdn \
              --output tsv)"
            HEALTH_URL="https://${origin_host}${HEALTH_PATH}"
          fi

          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            "${HEALTH_URL}"
