name: Claude review

# Kaller den delte reviewen i app-plattform. Kadens, prompt og modell
# vedlikeholdes DER — ikke dupliser dem hit; to kopier begynner å drive fra
# hverandre med en gang.
#
# Krever `CLAUDE_CODE_OAUTH_TOKEN` som repository secret i DETTE repoet.
# Personlig konto har ingen org-secrets å arve fra, så den må settes her.
on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

# `cancel-in-progress: false` med vilje. Concurrency evalueres på
# WORKFLOW-nivå, før jobbens `if` — så enhver kommentar på PR-en tar
# gruppeplassen, også de som ender som `skipped`. Med `true` drepte Claudes
# EGEN review-kommentar kjøringen som nettopp hadde postet den, og en
# fullført review ble rapportert som `cancelled` (verifisert: legevakta#415).
concurrency:
  group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    # Repoet er offentlig: hvem som helst kan kommentere på en PR. Den delte
    # workflowen sjekker bare at kommentaren ikke er fra en bot og inneholder
    # `@claude` — kombinert med `secrets: inherit` og `pull-requests: write`
    # under ville en fremmed dermed kunne trigge en review av sin egen kode
    # med dette repoets Claude-token. Kadensen for øvrig (draft, dependabot,
    # `@claude`) styres fortsatt der.
    if: >-
      (github.event_name == 'pull_request' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.pull_request.author_association)) ||
      (github.event_name == 'issue_comment' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association))
    # MÅ stå her, ikke i den gjenbrukbare workflowen. En kalt workflow kan
    # bare få rettigheter kalleren allerede har — og repoets standard er
    # `read`. Uten dette avviser GitHub kallet med `startup_failure` før
    # jobben starter, uten logg og uten at det vises som sjekk på PR-en.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: aridder/app-plattform/.github/workflows/claude-review-reusable.yml@main
    secrets: inherit
    with:
      extra_prompt: |
        Dette repoet er en MAL nye apper genereres fra, og den håndterer
        betaling via Vipps. To konsekvenser:

        - En feil i oppsettet kopieres inn i hver avledede app og oppdages
          først i en annen kodebase. Si eksplisitt fra når en endring
          forplanter seg.
        - Betalingsflyten er pengelogikk: se særlig etter manglende
          idempotens ved retry, beløp og valuta som kan avvike mellom
          forespørsel og bekreftelse, callback-/webhook-håndtering uten
          verifisering av avsender, og tilstander der en betaling kan bli
          registrert to ganger eller ikke i det hele tatt. Slikt er P1.
