name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    env:
      # Dummy values — build renders all routes dynamically, no DB is hit.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      DATABASE_URL_UNPOOLED: postgresql://user:pass@localhost:5432/db
      AUTH_SECRET: ci-build-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: write # push screenshots to the ci-screenshots branch
      pull-requests: write # comment on the PR
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/app
      AUTH_SECRET: ci-e2e-secret
      ENABLE_DEV_LOGIN: "true"
      APP_NAME: App Starter
      # Enable the admin billing console so e2e captures a screenshot of it.
      FEATURE_PAYMENT_ADMIN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply migrations & seed
        run: |
          npx prisma migrate deploy
          npx prisma db seed
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            screenshots/
          if-no-files-found: ignore
      - name: Publish screenshots inline on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          ls screenshots/*.png >/dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          # Publish PNGs to an orphan 'ci-screenshots' branch. PR comments use
          # relative blob links so authenticated readers can view private repos.
          TMP="$(mktemp -d)"
          if git clone --depth 1 --branch ci-screenshots \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" "$TMP" 2>/dev/null; then
            :
          else
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" "$TMP"
            ( cd "$TMP" && git checkout --orphan ci-screenshots && git rm -rf . >/dev/null 2>&1 || true )
          fi
          rm -rf "$TMP/pr-${PR}" && mkdir -p "$TMP/pr-${PR}"
          cp screenshots/*.png "$TMP/pr-${PR}/"
          (
            cd "$TMP"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "pr-${PR}"
            git commit -m "screenshots for PR #${PR} (${SHA})" || { echo "no change"; exit 0; }
            git push origin HEAD:ci-screenshots
          )
          # Build a Markdown comment with inline images. Relative repository
          # links retain the viewer's GitHub authentication for private repos.
          BASE="../blob/ci-screenshots/pr-${PR}"
          {
            echo "### 📸 E2E screenshots"
            echo
            for f in $(ls screenshots/*.png | xargs -n1 basename | sort); do
              echo "**${f}**"
              echo
              echo "![${f}](${BASE}/${f}?raw=true&sha=${SHA})"
              echo
            done
            echo "<sub>Updated for commit ${SHA}. Generated by CI.</sub>"
          } > comment.md
          gh pr comment "${PR}" --body-file comment.md --edit-last 2>/dev/null \
            || gh pr comment "${PR}" --body-file comment.md
